# JFER configuration for WOMD interaction prediction.

RELEASE:
  DATA_ROOT: /path/to/processed/waymo
  PRETRAINED_MODEL: /path/to/pretrained/joint_forecaster.pth
  CUDA_VISIBLE_DEVICES: 0,1,2,3,4
  GLOBAL_BATCH_SIZE: 80
  WORKERS_PER_GPU: 8
  RUN_NAME: jfer_train
  SEED: 666
  TRAINING_STAGES:
  - NAME: structured_bank
    TRAIN_STAGE: candidate_bank_warmup
    EPOCHS: 3
    LEARNING_RATE: 0.0001
    TRAIN_SAMPLE_INTERVAL: 5
  - NAME: metric_scoring
    TRAIN_STAGE: candidate_bank_ap_calibration
    EPOCHS: 6
    LEARNING_RATE: 0.0001
    TRAIN_SAMPLE_INTERVAL: 5
  - NAME: complementary_expansion
    TRAIN_STAGE: candidate_bank_expansion
    EPOCHS: 6
    LEARNING_RATE: 0.0001
    TRAIN_SAMPLE_INTERVAL: 5
  - NAME: expansion_calibration
    TRAIN_STAGE: candidate_bank_expansion_calibration
    EPOCHS: 3
    LEARNING_RATE: 0.0001
    TRAIN_SAMPLE_INTERVAL: 5
  - NAME: residual_refinement
    TRAIN_STAGE: candidate_bank_residual_flow_geometry
    EPOCHS: 6
    LEARNING_RATE: 0.0001
    TRAIN_SAMPLE_INTERVAL: 5

DATA_CONFIG:
  DATASET: WaymoInteractivePairCenterDataset
  OBJECT_TYPE:
  - TYPE_VEHICLE
  - TYPE_PEDESTRIAN
  - TYPE_CYCLIST
  DATA_ROOT: data/waymo
  SPLIT_DIR:
    train: processed_scenarios_training
    test: processed_scenarios_validation_interactive
  INFO_FILE:
    train: processed_scenarios_training_infos.pkl
    test: processed_scenarios_validation_interactive_infos.pkl
  SAMPLE_INTERVAL:
    train: 5
    test: 1
  INFO_FILTER_DICT:
    filter_info_by_interactive_pair:
    - TYPE_VEHICLE
    - TYPE_PEDESTRIAN
    - TYPE_CYCLIST
    filter_info_by_objects_of_interest:
    - TYPE_VEHICLE
    - TYPE_PEDESTRIAN
    - TYPE_CYCLIST
  EVAL_METHOD: waymo_interaction
  PAIR_SELECTION: official_objects_of_interest
  PAIR_INTERACTION_HORIZON: 8.0
  POINT_SAMPLED_INTERVAL: 1
  NUM_POINTS_EACH_POLYLINE: 20
  VECTOR_BREAK_DIST_THRESH: 1.0
  NUM_OF_SRC_POLYLINES: 768
  CENTER_OFFSET_OF_MAP:
  - 30.0
  - 0
  COMPUTE_SOFT_MAP: true
  SOFT_MAP_PROGRESS_INTERVAL: 0
  SAMPLE_OFFSET:
    train: 0
    test: 0
MODEL:
  ARCHITECTURE: JFER
  CONTEXT_ENCODER:
    NAME: SceneEncoder
    NUM_OF_ATTN_NEIGHBORS: 16
    NUM_INPUT_ATTR_AGENT: 29
    NUM_INPUT_ATTR_MAP: 9
    NUM_CHANNEL_IN_MLP_AGENT: 256
    NUM_CHANNEL_IN_MLP_MAP: 64
    NUM_LAYER_IN_MLP_AGENT: 3
    NUM_LAYER_IN_MLP_MAP: 5
    NUM_LAYER_IN_PRE_MLP_MAP: 3
    D_MODEL: 256
    NUM_ATTN_LAYERS: 6
    NUM_ATTN_HEAD: 8
    DROPOUT_OF_ATTN: 0.1
    USE_LOCAL_ATTN: true
  MOTION_DECODER:
    NAME: JFERDecoder
    OBJECT_TYPE:
    - TYPE_VEHICLE
    - TYPE_PEDESTRIAN
    - TYPE_CYCLIST
    CENTER_OFFSET_OF_MAP:
    - 30.0
    - 0
    NUM_FUTURE_FRAMES: 80
    NUM_MOTION_MODES: 6
    INTENTION_POINTS_FILE: resources/intention_anchors.pkl
    D_MODEL: 512
    NUM_DECODER_LAYERS: 6
    NUM_ATTN_HEAD: 8
    MAP_D_MODEL: 256
    DROPOUT_OF_ATTN: 0.1
    NUM_BASE_MAP_POLYLINES: 256
    NUM_WAYPOINT_MAP_POLYLINES: 128
    LOSS_WEIGHTS:
      cls: 1.0
      reg: 1.0
      vel: 0.5
    NMS_DIST_THRESH: 2.5
    INTEGRATED_JOINT_WORLD:
      ENABLED: true
      TRAIN_STAGE: candidate_bank_residual_flow_geometry
      LOSS_SCALE: 1.0
      DIRECT_SPARSE_MODES: true
      ORDERED_MODE_DECODING: true
      MODE_REARRANGEMENT: true
      DIRECT_JOINT_SCORE: true
      USE_MA_EMTA: true
      USE_PROGRESSIVE_EMTA: false
      USE_HORIZON_LISTWISE: false
